# cargo-nextest settings. CI runs the workspace tests with `cargo nextest run --profile ci`,
# so test binaries run in parallel instead of one after another; `cargo test` still works
# locally and ignores this file. Nextest runs each test in its own process, as many at
# once as the machine has CPUs, the same parallelism cargo test uses inside one binary.

[test-groups]
# Tests that build the Go example plugins (cpa_plugin::testing::built_plugins). They all
# write the same files under target/tmp/goplugins and each build uses every core, so
# they run one at a time, as they did when each was alone in its binary.
go-plugins = { max-threads = 1 }

# The heap gate counts this process's allocations against bench/budgets.txt. It runs
# alone and first, as it did under cargo test, where it was the only test in its binary.
# Its output, the measured values, is shown even when it passes, so a change can update
# the budgets from the log.
[[profile.default.overrides]]
filter = 'binary_id(cpa-server::alloc_budget)'
threads-required = 'num-test-threads'
priority = 100
success-output = 'final'

# Tests that assert an upper bound on elapsed wall-clock time run alone too, right after
# the heap gate, so no other test can slow them down.
[[profile.default.overrides]]
filter = '''
    binary_id(cpa-server::duplex_dispatch)
    | (binary_id(cpa-exec) & (test(/^codex_ws::tests::duplex::/)
        | test(=codex_live::tests::redact_sdp_scans_many_markers_in_one_pass)
        | test(=antigravity_request::tests::tool_schemas_are_cleaned_in_one_pass)))
    | (binary_id(cpa-server) & test(/^websocket::tests::/))
    | (binary_id(cliproxy::bin/cliproxy) & (
        test(=home::tests::usage_and_in_flight_reach_home_and_drains_cancel_running_work)
        | test(=home::tests::a_drain_cancels_a_stalled_alpha_search)
        | test(=home::tests::a_drain_ends_a_retained_live_pick)
        | test(=home::tests::a_pooled_codex_socket_keeps_its_home_pick)
        | test(=home::tests::a_drain_cancels_stalled_live_reads_and_handshakes)
        | test(=home::tests::an_available_next_round_starts_immediately)
        | test(=home::tests::home_busy_skips_outer_retries)))
'''
threads-required = 'num-test-threads'
priority = 90

[[profile.default.overrides]]
filter = '''
    binary_id(cpa-server::plugin_routes) | binary_id(cpa-server::plugin_quota_cooldown)
    | binary_id(cliproxy::plugin_cli) | binary_id(cliproxy::plugin_wiring)
    | binary_id(cpa-plugin::go_host) | binary_id(cpa-plugin::native_abi)
'''
test-group = 'go-plugins'
priority = 50

# The slowest binaries (10 to 30 s tests) start before the short ones, so none of them is
# left running alone at the end.
[[profile.default.overrides]]
filter = '''
    binary_id(cpa-translate::golden) | binary_id(cpa-server::legacy_go)
    | binary_id(cpa-server::media_go) | binary_id(cpa-server::quota_trust)
    | binary_id(cpa-server::manage_go)
'''
priority = 40

[profile.ci]
# Report every failure in one run, each with its output again at the end.
fail-fast = false
failure-output = 'immediate-final'
